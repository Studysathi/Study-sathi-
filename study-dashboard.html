<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Smart Study Dashboard | StudySaathi</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

  <!-- Back Link -->

  <div class="dashboard-back">

    <a href="advanced-study.html">
      ← Back to Advanced Study Hub
    </a>

  </div>


  <!-- Header -->

  <header class="dashboard-header">

    <div class="dashboard-header-icon">
      📊
    </div>

    <h1>Smart Study Dashboard</h1>

    <p>
      Track your study progress, tasks and learning activity.
    </p>

  </header>


  <!-- Dashboard Cards -->

  <section class="dashboard-section">

    <div class="dashboard-container">


      <div class="dashboard-card">

        <div class="dashboard-icon">⏱️</div>

        <h3>Today's Study Time</h3>

        <p id="dashboardStudyTime">
          0 minutes
        </p>

      </div>


      <div class="dashboard-card">

        <div class="dashboard-icon">📋</div>

        <h3>Total Tasks</h3>

        <p id="dashboardTotalTasks">
          0
        </p>

      </div>


      <div class="dashboard-card">

        <div class="dashboard-icon">✅</div>

        <h3>Completed Tasks</h3>

        <p id="dashboardCompletedTasks">
          0
        </p>

      </div>


      <div class="dashboard-card">

        <div class="dashboard-icon">🔥</div>

        <h3>Study Streak</h3>

        <p id="dashboardStreak">
          0 days
        </p>

      </div>


      <div class="dashboard-card dashboard-progress-card">

        <h3>Today's Progress</h3>

        <div class="dashboard-progress-bar">

          <div
            id="dashboardProgress"
            class="dashboard-progress-fill"
          ></div>

        </div>

        <p id="dashboardProgressText">
          0%
        </p>

      </div>


    </div>

  </section>
<script>

  // =========================
  // Today's Study Time
  // =========================

  const today =
    new Date().toISOString().split("T")[0];


  const savedStudyData =
    JSON.parse(
      localStorage.getItem("studySaathiStudyTime")
      || "{}"
    );


  const todayStudyTime =
    savedStudyData[today] || 0;


  document.getElementById(
    "dashboardStudyTime"
  ).textContent =
    todayStudyTime + " minutes";


  // =========================
  // Study Planner Data
  // =========================

  const savedPlans =
    JSON.parse(
      localStorage.getItem("studySaathiPlans")
      || "[]"
    );


  // Total Tasks

  const totalTasks =
    savedPlans.length;


  document.getElementById(
    "dashboardTotalTasks"
  ).textContent =
    totalTasks;


  // Completed Tasks

  const completedTasks =
    savedPlans.filter(function (plan) {

      return (
        typeof plan === "object" &&
        plan.completed === true
      );

    }).length;


  document.getElementById(
    "dashboardCompletedTasks"
  ).textContent =
    completedTasks;


  // Today's Progress

  let progress = 0;


  if (totalTasks > 0) {

    progress =
      Math.round(
        (completedTasks / totalTasks) * 100
      );

  }


  document.getElementById(
    "dashboardProgress"
  ).style.width =
    progress + "%";


  document.getElementById(
    "dashboardProgressText"
  ).textContent =
    progress + "%";

</script>

</body>

</html>
