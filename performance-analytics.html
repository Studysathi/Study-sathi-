<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Performance Analytics | StudySaathi</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="dashboard-back">
    <a href="advanced-study.html">← Back to Advanced Study Hub</a>
  </div>

  <header class="dashboard-header">
    <div class="dashboard-header-icon">📈</div>

    <h1>Performance Analytics</h1>

    <p>
      Understand your study activity and track your improvement.
    </p>
  </header>


  <section class="dashboard-section">

    <div class="dashboard-container">

      <div class="dashboard-card">
        <div class="dashboard-icon">⏱️</div>
        <h3>Today's Study Time</h3>
        <p id="analyticsStudyTime">0 minutes</p>
      </div>


      <div class="dashboard-card">
        <div class="dashboard-icon">📋</div>
        <h3>Total Study Tasks</h3>
        <p id="analyticsTotalTasks">0</p>
      </div>


      <div class="dashboard-card">
        <div class="dashboard-icon">✅</div>
        <h3>Completed Tasks</h3>
        <p id="analyticsCompletedTasks">0</p>
      </div>


      <div class="dashboard-card">
        <div class="dashboard-icon">🎯</div>
        <h3>Task Completion</h3>
        <p id="analyticsCompletion">0%</p>
      </div>


      <div class="dashboard-card dashboard-progress-card">

        <h3>📊 Your Study Progress</h3>

        <div class="dashboard-progress-bar">
          <div
            id="analyticsProgress"
            class="dashboard-progress-fill">
          </div>
        </div>

        <p id="analyticsProgressText">
          0% Complete
        </p>

      </div>

    </div>

  </section>


  <script>

    // Today's Study Time

    const today =
      new Date().toISOString().split("T")[0];

    const savedStudyData =
      JSON.parse(
        localStorage.getItem(
          "studySaathiStudyTime"
        ) || "{}"
      );

    const todayStudyTime =
      Number(savedStudyData[today]) || 0;


    document.getElementById(
      "analyticsStudyTime"
    ).textContent =
      todayStudyTime + " minutes";


    // Study Tasks

    const savedTasks =
      JSON.parse(
        localStorage.getItem(
          "studySaathiTasks"
        ) || "[]"
      );


    const totalTasks =
      savedTasks.length;


    const completedTasks =
      savedTasks.filter(function (task) {

        return (
          typeof task === "object" &&
          task.completed === true
        );

      }).length;


    document.getElementById(
      "analyticsTotalTasks"
    ).textContent =
      totalTasks;


    document.getElementById(
      "analyticsCompletedTasks"
    ).textContent =
      completedTasks;


    // Completion Percentage

    let completion = 0;


    if (totalTasks > 0) {

      completion =
        Math.round(
          (completedTasks / totalTasks) * 100
        );

    }


    document.getElementById(
      "analyticsCompletion"
    ).textContent =
      completion + "%";


    // Progress Bar

    document.getElementById(
      "analyticsProgress"
    ).style.width =
      completion + "%";


    document.getElementById(
      "analyticsProgressText"
    ).textContent =
      completion + "% Complete";

  </script>

</body>

</html>
